# Mantiene despierto el proyecto de Supabase (D89).
# El plan gratuito pausa el proyecto tras unos días sin uso y entonces nadie puede crear cuenta
# ni iniciar sesión. Una consulta diaria a la base de datos cuenta como actividad.
#
# Necesita dos secretos del repositorio (Settings › Secrets and variables › Actions):
#   SUPABASE_URL       = el valor de EXPO_PUBLIC_SUPABASE_URL
#   SUPABASE_ANON_KEY  = el valor de EXPO_PUBLIC_SUPABASE_ANON_KEY (la llave pública, nunca la service_role)
name: Supabase despierto

on:
  schedule:
    - cron: '17 11 * * *' # todos los días, 6:17 a. m. en Colombia
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y SUPABASE_ANON_KEY"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Respuesta: $code"
          # Si el proyecto ya está pausado, el dominio no existe (000): hay que reactivarlo a mano
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no respondió ($code). Revisa si el proyecto está pausado en el panel de Supabase."
            exit 1
          fi
